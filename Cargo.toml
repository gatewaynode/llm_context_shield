[package]
name = "llm_context_shield"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "UNIX-style CLI scanner for LLM context injection threats"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
toml = "0.8"
yara-x = { path = "../yara-x/lib", optional = true }
syara-x = { path = "../syara-x/syara", optional = true }

[features]
default = []
yara = ["dep:yara-x"]
syara = ["dep:syara-x"]
syara-sbert = ["syara", "syara-x/sbert"]
syara-classifier = ["syara", "syara-x/classifier"]
syara-llm = ["syara", "syara-x/llm"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
