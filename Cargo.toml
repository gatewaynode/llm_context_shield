[package]
name = "llm_context_shield"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "UNIX-style CLI scanner for LLM context injection threats"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
