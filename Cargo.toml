[package]
name = "llm_context_shield"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Rust library and CLI for scanning LLM context injection threats"

[lib]
name = "llm_context_shield"
path = "src/lib.rs"

[[bin]]
name = "lcs"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "=0.10.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }
tracing-appender = { version = "0.2", optional = true }
toml = "0.8"
yara-x = { version = "1.14", optional = true }
syara-x = { version = "0.3.1", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:tracing-appender"]
yara = ["dep:yara-x"]
syara = ["dep:syara-x"]
# Semantic matcher features — propagate to syara-x backends.
# ONNX-local backends (no HTTP server required; need libonnxruntime at runtime).
syara-sbert = ["syara", "syara-x/sbert-onnx"]
syara-classifier = ["syara-sbert", "syara-x/classifier-onnx"]
# HTTP-endpoint LLM evaluator (OpenAI-compatible: LM Studio, Ollama shim, etc.).
syara-llm = ["syara", "syara-x/llm"]
# Meta-feature enabling the tests/semantic_rules.rs integration binary.
semantic-integration = ["syara-sbert", "syara-llm"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
